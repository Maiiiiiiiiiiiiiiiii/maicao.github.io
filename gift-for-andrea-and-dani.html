<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrea & Dani</title>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f0f8ff;
    }
    
    .body-bg {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .container {
      width: 1440px;
      height: 900px;
      position: absolute;
      transform-origin: top left;
      overflow: hidden;
      background: #f0f8ff;
    }
    
    /* 初始SVG元素样式 */
    .svg-lecco-mount {
      position: absolute;
      width: 1476px;
      height: 981px;
      left: -31px;
      top: -40px;
      z-index: 1;
      cursor: pointer;
      transition: transform 0.3s;
    }
    
    .svg-lecco-mount:hover {
      transform: scale(1.01);
    }
    
    .svg-andrea {
      position: absolute;
      width: 554px;
      height: 746px;
      left: 131px;
      top: 72px;
      z-index: 2;
      animation: float-andrea 6s ease-in-out infinite;
      transition: transform 1.2s ease-in-out, opacity 1s ease-in-out;
    }
    
    .svg-dani {
      position: absolute;
      width: 479px;
      height: 622px;
      left: 823px;
      top: 196px;
      z-index: 2;
      animation: float-dani 7s ease-in-out infinite;
      transition: transform 1.2s ease-in-out, opacity 1s ease-in-out;
    }
    
    /* 新SVG元素样式 - 初始隐藏 */
    .svg-lecco-rainbow {
      position: absolute;
      width: 1445px;
      height: 962px;
      left: 0px;
      top: -3px;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      pointer-events: none;
    }
    
    .svg-andrea2 {
      position: absolute;
      width: 489.65px;
      height: 731.26px;
      left: 0px;
      top: 169px;
      z-index: 2;
      opacity: 0;
      transform: translateX(-100px);
      transition: transform 1.2s ease-out, opacity 1.2s ease-out;
      pointer-events: none;
    }
    
    .svg-dani2 {
      position: absolute;
      width: 479.18px;
      height: 471.41px;
      left: 353px;
      top: 432px;
      z-index: 2;
      opacity: 0;
      transform: translateY(100px);
      transition: transform 1.2s ease-out, opacity 1.2s ease-out;
      pointer-events: none;
    }
    
    .svg-cat1 {
      position: absolute;
      width: 238.26px;
      height: 303.92px;
      left: 14px;
      top: 656px;
      z-index: 3;
      opacity: 0;
      transform: translateY(50px) rotate(-10deg);
      transition: transform 1.2s ease-out, opacity 1.2s ease-out;
      pointer-events: none;
    }
    
    .svg-cat2 {
      position: absolute;
      width: 206.73px;
      height: 312.69px;
      left: 238px;
      top: 667px;
      z-index: 3;
      opacity: 0;
      transform: translateY(50px) rotate(10deg);
      transition: transform 1.2s ease-out, opacity 1.2s ease-out;
      pointer-events: none;
    }
    
    /* 浮动动画 */
    @keyframes float-andrea {
      0%, 100% { transform: translateY(0) rotate(0.5deg); }
      50% { transform: translateY(-12px) rotate(-0.5deg); }
    }
    
    @keyframes float-dani {
      0%, 100% { transform: translateY(0) rotate(-0.5deg); }
      50% { transform: translateY(-10px) rotate(0.5deg); }
    }
    
    /* 激活状态 - 第一组元素离开，第二组元素进入 */
    .active .svg-andrea {
      transform: translateX(-800px) rotate(-15deg);
      opacity: 0;
    }
    
    .active .svg-dani {
      transform: translateX(800px) rotate(15deg);
      opacity: 0;
    }
    
    .active .svg-lecco-rainbow {
      opacity: 1;
    }
    
    .active .svg-andrea2 {
      opacity: 1;
      transform: translateX(0);
      transition-delay: 0.5s;
    }
    
    .active .svg-dani2 {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.7s;
    }
    
    .active .svg-cat1 {
      opacity: 1;
      transform: translateY(0) rotate(0);
      transition-delay: 0.9s;
    }
    
    .active .svg-cat2 {
      opacity: 1;
      transform: translateY(0) rotate(0);
      transition-delay: 1.1s;
    }
    
    /* 返回动画 - 第二组元素离开，第一组元素返回 */
    .returning .svg-andrea {
      transform: translateX(0);
      opacity: 1;
      transition-delay: 1.1s;
    }
    
    .returning .svg-dani {
      transform: translateX(0);
      opacity: 1;
      transition-delay: 0.9s;
    }
    
    .returning .svg-lecco-rainbow {
      opacity: 0;
      transition-delay: 0.3s;
    }
    
    .returning .svg-andrea2 {
      opacity: 0;
      transform: translateX(-100px);
      transition-delay: 0.5s;
    }
    
    .returning .svg-dani2 {
      opacity: 0;
      transform: translateY(100px);
      transition-delay: 0.7s;
    }
    
    .returning .svg-cat1 {
      opacity: 0;
      transform: translateY(50px) rotate(-10deg);
      transition-delay: 0.5s;
    }
    
    .returning .svg-cat2 {
      opacity: 0;
      transform: translateY(50px) rotate(10deg);
      transition-delay: 0.3s;
    }
  </style>
</head>
<body>
  <div class="body-bg">
    <div class="container" id="main-container">
      <!-- 初始SVG元素 -->
      <img class="svg-lecco-mount" src="assets/asset-andrew-dani/lecco-mount.svg" alt="Lecco Mountain">
      <img class="svg-andrea" src="assets/asset-andrew-dani/Andrea.svg" alt="Andrea">
      <img class="svg-dani" src="assets/asset-andrew-dani/Dani.svg" alt="Dani">
      
      <!-- 新SVG元素 -->
      <img class="svg-lecco-rainbow" src="assets/asset-andrew-dani/lecco-rainbow.svg" alt="Lecco Rainbow">
      <img class="svg-andrea2" src="assets/asset-andrew-dani/Andrea2.svg" alt="Andrea 2">
      <img class="svg-dani2" src="assets/asset-andrew-dani/Dani2.svg" alt="Dani 2">
      <img class="svg-cat1" src="assets/asset-andrew-dani/Cat1.svg" alt="Cat 1">
      <img class="svg-cat2" src="assets/asset-andrew-dani/Cat2.svg" alt="Cat 2">
    </div>
  </div>

  <script>
    // 缩放函数
    function resizeContainer() {
      const scale = Math.min(
        window.innerWidth / 1440,
        window.innerHeight / 900
      );
      const container = document.querySelector('.container');
      container.style.transform = `scale(${scale})`;
      container.style.position = 'absolute';
      container.style.left = `${(window.innerWidth - 1440 * scale) / 2}px`;
      container.style.top = `${(window.innerHeight - 900 * scale) / 2}px`;
    }

    // 为浮动元素添加悬停停止动画功能
    document.querySelectorAll('.svg-andrea, .svg-dani').forEach(el => {
      el.addEventListener('mouseenter', function() {
        this.style.animationPlayState = 'paused';
      });
      
      el.addEventListener('mouseleave', function() {
        this.style.animationPlayState = 'running';
      });
    });

    // 状态管理
    let isActive = false;
    
    // 点击lecco-mount触发动画
    document.querySelector('.svg-lecco-mount').addEventListener('click', function() {
      const container = document.getElementById('main-container');
      
      if (!isActive) {
        // 切换到第二组元素
        container.classList.remove('returning');
        void container.offsetWidth; // 触发重绘
        container.classList.add('active');
        isActive = true;
      } else {
        // 返回到第一组元素
        container.classList.remove('active');
        void container.offsetWidth; // 触发重绘
        container.classList.add('returning');
        isActive = false;
        
        // 移除returning类，以便下次切换
        setTimeout(() => {
          container.classList.remove('returning');
        }, 1500);
      }
      
      // 点击后移除悬停效果，防止干扰
      document.querySelectorAll('.svg-andrea, .svg-dani').forEach(el => {
        el.style.animationPlayState = 'running';
      });
    });

    window.addEventListener('resize', function() {
      resizeContainer();
    });
    
    window.addEventListener('DOMContentLoaded', function() {
      resizeContainer();
    });
  </script>
</body>
</html>
