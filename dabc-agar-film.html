<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DABC KITCHEN MENU</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300&family=Rationale&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
  <style>
    /* 基础样式 */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* 主容器 */
    .frame-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .frame {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #FFFFFF;
      transform-origin: top left;
    }
    
    /* DABC KITCHEN 标题 */
    .dabc-kitchen {
      position: absolute;
      width: 403.41px;
      height: 46px;
      left: calc(50% - 403.41px/2 + 1.71px);
      top: 50px;
    }
    
    .label {
      position: absolute;
      font-family: 'Rationale', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 40px;
      line-height: 46px;
      text-align: center;
      color: #000000;
      transition: transform 0.5s ease;
      pointer-events: none; /* 防止标签阻止容器点击 */
    }

    .label-paper-panel {
      width: 170px;
      height: 46px;
      left: 877px;
      top: 120px;
    }
    
    .label-paper-panel-2 {
      width: 222px;
      height: 46px;
      left: 562px;
      top: 485px;
    }

    .label-paper-panel-3 {
      width: 253px;
      height: 46px;
      left: 537px;
      top: 626px;
    }



    .recipe {
        position: absolute;
        width: 87px;
        height: 29px;
        left: 866px;
        top: 367px;
        font-family: 'Recursive';
        font-style: normal;
        font-weight: 400;
        font-size: 24px;
        line-height: 29px;
        /* identical to box height */
        text-align: center;
        color: #000000;
    }
    
    .tutorial-video {
      /* Tutorial Video */
      position: absolute;
      width: 116px;
      height: 58px;
      left: 1114px;
      top: 367px;
      font-family: 'Recursive';
      font-style: normal;
      font-weight: 400;
      font-size: 24px;
      line-height: 29px;
      color: #000000;
    }
    
    .application {
        position: absolute;
        width: 159px;
        height: 29px;
        left: 1455px;
        top: 367px;
        font-family: 'Recursive';
        font-style: normal;
        font-weight: 400;
        font-size: 24px;
        line-height: 29px;
        /* identical to box height */
        text-align: center;
        color: #000000;
    }

    .chef {
        position: absolute;
        width: 58px;
        height: 29px;
        left: calc(50% - 58px/2 - 679px);
        top: 751px;
        font-family: 'Recursive';
        font-style: normal;
        font-weight: 400;
        font-size: 24px;
        line-height: 29px;
        /* identical to box height */
        text-align: center;
        color: #000000;
    }
    
    .yinong-xue {
        position: absolute;
        width: 179px;
        height: 46px;
        left: calc(50% - 179px/2 - 678.5px);
        top: 780px;
        font-family: 'Reenie Beanie', cursive;
        font-style: normal;
        font-weight: 400;
        font-size: 40px;
        line-height: 46px;
        text-align: center;
        color: #000000;
    }
    
    /* Logo */
    .logo-dabc {
      position: absolute;
      width: 526px;

    }
    
    /* 返回按钮 */
    .dabc-back {

      width: 63px;
      height: 50.5px;

      top: 69px;
      cursor: pointer;
      transition: transform 0.3s ease;

    .dabc-back:hover {

    }
    
    /* 添加的SVG样式 */
    .portrait-yinong-xue {
      position: absolute;
      width: 253px;

      left: 158px;
      top: 271px;
    }
    
    .icon-recipe {
      position: absolute;
      width: 82px;
      height: 112px;
      left: 866px;
      top: 454px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .icon-recipe:hover {
      transform: scale(1.05);
    }
    
    .icon-recipe-1 {
      position: absolute;
      width: 82px;
      height: 112px;
      left: 866px;
      top: 589px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .icon-recipe-1:hover {
      transform: scale(1.05);
    }

    .icon-video-1 {
      position: absolute;
      width: 181px;
      height: 119px;
      left: 1114px;
      top: 454px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .icon-video-1:hover {
      transform: scale(1.05);
    }

    .icon-video-1-1 {
      position: absolute;
      width: 181px;
      height: 119px;
      left: 1114px;
      top: 589px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .icon-video-1-1:hover {
      transform: scale(1.05);
    }
    

    .icon-video-2 {
      position: absolute;
      width: 181px;
      height: 119px;
      left: 1455px;
      top: 454px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .icon-video-2:hover {
      transform: scale(1.05);
    }
    
    .icon-video-2-1 {
      position: absolute;
      width: 181px;
      height: 119px;
      left: 1455px;
      top: 589px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .icon-video-2-1:hover {
      transform: scale(1.05);
    }

    /* 视频覆盖层样式 */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    
    .video-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    .video-container {
      position: relative;
      width: 80%;
      max-width: 900px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    
    .video-player {
      width: 100%;
      display: block;
    }
    
    .video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
      padding: 15px;
      display: flex;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .video-container:hover .video-controls {
      opacity: 1;
    }
    
    .play-pause-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      margin-right: 15px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .progress-container {
      flex-grow: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      margin-right: 15px;
      cursor: pointer;
      position: relative;
    }
    
    .progress-bar {
      height: 100%;
      background: #e74c3c;
      border-radius: 5px;
      width: 0%;
    }
    
    .time-display {
      color: white;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      margin-right: 15px;
    }
    
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1010;
      transition: background 0.3s ease;
    }
    
    .close-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }
    
    .fullscreen-btn {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    /* 图片查看器样式 */
    .image-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      touch-action: none; /* 禁用默认触摸行为 */
    }
    
    .image-viewer.active {
      opacity: 1;
      visibility: visible;
    }
    
    .image-container {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: grab;
    }
    
    .image-container.dragging {
      cursor: grabbing;
    }
    
    .viewer-image {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      transition: transform 0.1s ease;
      transform-origin: center center;
      will-change: transform; /* 优化性能 */
    }
    
    .image-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 30px;
      z-index: 1010;
    }
    
    .zoom-btn, .reset-btn {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }
    
    .zoom-btn:hover, .reset-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .image-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1010;
      transition: background 0.3s ease;
    }
    
    .image-close-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }

  </style>
</head>
<body>

  <script>
    // 缩放函数
    function resizeFrame() {
      const frame = document.querySelector('.frame');
      const container = document.querySelector('.frame-container');
      
      // 计算缩放比例
      const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
      );
      
      // 应用缩放
      frame.style.transform = `scale(${scale})`;
      
      // 居中定位
      frame.style.position = 'absolute';
      frame.style.left = `${(window.innerWidth - 1920 * scale) / 2}px`;
      frame.style.top = `${(window.innerHeight - 1080 * scale) / 2}px`;
    }

    // 初始缩放和窗口调整事件
    window.addEventListener('load', function() {
      resizeFrame();
    });
    window.addEventListener('resize', resizeFrame);

    // SVG加载错误处理
    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('error', function() {
        console.error('无法加载图片: ', this.src);
        this.style.backgroundColor = '#f0f0f0';
        this.style.border = '2px dashed #ccc';
        this.style.display = 'flex';
        this.style.justifyContent = 'center';
        this.style.alignItems = 'center';
        this.style.fontSize = '12px';
        this.style.color = '#999';
        
        // 获取文件名
        const fileName = this.src.split('/').pop();
        this.alt = `无法加载: ${fileName}`;
        
        // 如果没有替代文本，使用文件名
        if (!this.nextElementSibling || !this.nextElementSibling.classList.contains('error-message')) {
          const errorMsg = document.createElement('div');
          errorMsg.className = 'error-message';
          errorMsg.textContent = `无法加载: ${fileName}`;
          errorMsg.style.position = 'absolute';
          errorMsg.style.top = '50%';
          errorMsg.style.left = '50%';
          errorMsg.style.transform = 'translate(-50%, -50%)';
          errorMsg.style.color = '#ff0000';
          errorMsg.style.fontSize = '14px';
          errorMsg.style.fontWeight = 'bold';
          this.appendChild(errorMsg);
        }
      });
    });

    // 视频播放功能
    document.addEventListener('DOMContentLoaded', function() {
      const videoOverlay = document.getElementById('video-overlay');
      const videoPlayer = document.getElementById('video-player');
      const closeVideo = document.getElementById('close-video');
      const playPauseBtn = document.getElementById('play-pause');
      const progressBar = document.getElementById('progress-bar');
      const progressContainer = document.getElementById('progress-container');
      const timeDisplay = document.getElementById('time-display');
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      
      // 为所有视频图标添加点击事件
      document.querySelectorAll('[data-video]').forEach(videoTrigger => {
        videoTrigger.addEventListener('click', function() {
          const videoSrc = this.getAttribute('data-video');
          videoPlayer.src = videoSrc;
          videoOverlay.classList.add('active');
          videoPlayer.play();
          updatePlayButton();
        });
      });
      
      // 关闭视频覆盖层
      closeVideo.addEventListener('click', function() {
        videoOverlay.classList.remove('active');
        videoPlayer.pause();
      });
      
      // 点击覆盖层背景关闭视频
      videoOverlay.addEventListener('click', function(e) {
        if (e.target === videoOverlay) {
          videoOverlay.classList.remove('active');
          videoPlayer.pause();
        }
      });
      
      // 播放/暂停按钮
      playPauseBtn.addEventListener('click', function() {
        if (videoPlayer.paused) {
          videoPlayer.play();
        } else {
          videoPlayer.pause();
        }
        updatePlayButton();
      });
      
      // 更新播放按钮状态
      function updatePlayButton() {
        if (videoPlayer.paused) {
          playPauseBtn.textContent = '▶';
        } else {
          playPauseBtn.textContent = '❚❚';
        }
      }
      
      // 更新进度条
      videoPlayer.addEventListener('timeupdate', function() {
        const progress = (videoPlayer.currentTime / videoPlayer.duration) * 100;
        progressBar.style.width = `${progress}%`;
        
        // 更新时间显示
        const currentTime = formatTime(videoPlayer.currentTime);
        const duration = formatTime(videoPlayer.duration);
        timeDisplay.textContent = `${currentTime} / ${duration}`;
      });
      
      // 点击进度条跳转
      progressContainer.addEventListener('click', function(e) {
        const rect = progressContainer.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;
        const seekTime = (clickX / width) * videoPlayer.duration;
        videoPlayer.currentTime = seekTime;
      });
      
      // 视频结束重置
      videoPlayer.addEventListener('ended', function() {
        playPauseBtn.textContent = '▶';
        progressBar.style.width = '0%';
      });
      
      // 全屏按钮
      fullscreenBtn.addEventListener('click', function() {
        if (videoPlayer.requestFullscreen) {
          videoPlayer.requestFullscreen();
        } else if (videoPlayer.webkitRequestFullscreen) {
          videoPlayer.webkitRequestFullscreen();
        } else if (videoPlayer.msRequestFullscreen) {
          videoPlayer.msRequestFullscreen();
        }
      });
      
      // 格式化时间显示
      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }
      
      // 键盘控制
      document.addEventListener('keydown', function(e) {
        if (videoOverlay.classList.contains('active')) {
          if (e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            if (videoPlayer.paused) {
              videoPlayer.play();
            } else {
              videoPlayer.pause();
            }
            updatePlayButton();
          } else if (e.key === 'Escape') {
            videoOverlay.classList.remove('active');
            videoPlayer.pause();
          }
        }
      });
    });

    // 图片查看器功能
    document.addEventListener('DOMContentLoaded', function() {
      const recipe1 = document.getElementById('recipe-1');
      const recipe2 = document.getElementById('recipe-2');
      const imageViewer = document.getElementById('image-viewer');
      const viewerImage = document.getElementById('viewer-image');
      const imageCloseBtn = document.getElementById('image-close-btn');
      const zoomInBtn = document.getElementById('zoom-in');
      const zoomOutBtn = document.getElementById('zoom-out');
      const resetZoomBtn = document.getElementById('reset-zoom');
      const imageContainer = document.querySelector('.image-container');
      
      let currentScale = 1;
      let initialDistance = null;
      let lastScale = 1;
      const minScale = 0.5;
      const maxScale = 5;
      
      // 拖拽相关变量
      let isDragging = false;
      let startX, startY;
      let translateX = 0, translateY = 0;
      let lastTranslateX = 0, lastTranslateY = 0;
      
      // 食谱图片路径
      const recipeImages = [
        'assets/material_asset/recipe/bio-film-recipe1-brick.png',
        'assets/material_asset/recipe/bio-film-recipe2-film.png'
      ];
      
      // 打开图片查看器
      function openImageViewer(imageIndex) {
        viewerImage.src = recipeImages[imageIndex];
        resetZoom();
        imageViewer.classList.add('active');
      }
      
      // 重置缩放和位置
      function resetZoom() {
        currentScale = 1;
        translateX = 0;
        translateY = 0;
        lastTranslateX = 0;
        lastTranslateY = 0;
        updateImageTransform();
      }
      
      // 更新图片变换
      function updateImageTransform() {
        viewerImage.style.transform = `scale(${currentScale}) translate(${translateX}px, ${translateY}px)`;
      }
      
      // 设置缩放比例
      function setScale(scale) {
        currentScale = Math.max(minScale, Math.min(maxScale, scale));
        updateImageTransform();
      }
      
      // 关闭图片查看器
      imageCloseBtn.addEventListener('click', function() {
        imageViewer.classList.remove('active');
        resetZoom();
      });
      
      // 点击查看器背景关闭
      imageViewer.addEventListener('click', function(e) {
        if (e.target === imageViewer) {
          imageViewer.classList.remove('active');
          resetZoom();
        }
      });
      
      // 缩放按钮
      zoomInBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        setScale(currentScale + 0.2);
      });
      
      zoomOutBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        setScale(currentScale - 0.2);
      });
      
      resetZoomBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        resetZoom();
      });
      
      // 鼠标滚轮缩放
      imageViewer.addEventListener('wheel', function(e) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.2 : 0.2;
        setScale(currentScale + delta);
      });
      
      // 鼠标拖拽功能
      imageContainer.addEventListener('mousedown', function(e) {
        if (currentScale > 1) {
          isDragging = true;
          startX = e.clientX - translateX;
          startY = e.clientY - translateY;
          imageContainer.classList.add('dragging');
        }
      });
      
      document.addEventListener('mousemove', function(e) {
        if (isDragging && currentScale > 1) {
          e.preventDefault();
          translateX = e.clientX - startX;
          translateY = e.clientY - startY;
          updateImageTransform();
        }
      });
      
      document.addEventListener('mouseup', function() {
        if (isDragging) {
          isDragging = false;
          imageContainer.classList.remove('dragging');
          lastTranslateX = translateX;
          lastTranslateY = translateY;
        }
      });
      
      // 触摸事件 - 多点触控缩放
      imageViewer.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          e.preventDefault();
          initialDistance = getDistance(e.touches[0], e.touches[1]);
          lastScale = currentScale;
        } else if (e.touches.length === 1 && currentScale > 1) {
          // 单指触摸 - 拖拽
          isDragging = true;
          startX = e.touches[0].clientX - translateX;
          startY = e.touches[0].clientY - translateY;
          imageContainer.classList.add('dragging');
        }
      });
      
      imageViewer.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2) {
          e.preventDefault();
          const currentDistance = getDistance(e.touches[0], e.touches[1]);
          if (initialDistance !== null) {
            const scaleFactor = currentDistance / initialDistance;
            setScale(lastScale * scaleFactor);
          }
        } else if (e.touches.length === 1 && isDragging && currentScale > 1) {
          // 单指触摸移动 - 拖拽
          e.preventDefault();
          translateX = e.touches[0].clientX - startX;
          translateY = e.touches[0].clientY - startY;
          updateImageTransform();
        }
      });
      
      imageViewer.addEventListener('touchend', function(e) {
        if (e.touches.length < 2) {
          initialDistance = null;
        }
        
        if (e.touches.length === 0 && isDragging) {
          isDragging = false;
          imageContainer.classList.remove('dragging');
          lastTranslateX = translateX;
          lastTranslateY = translateY;
        }
      });
      
      // 计算两点之间的距离
      function getDistance(touch1, touch2) {
        const dx = touch2.clientX - touch1.clientX;
        const dy = touch2.clientY - touch1.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
      
      // 绑定食谱图标点击事件
      recipe1.addEventListener('click', function() {
        openImageViewer(0);
      });
      
      recipe2.addEventListener('click', function() {
        openImageViewer(1);
      });
      
      // 键盘控制
      document.addEventListener('keydown', function(e) {
        if (imageViewer.classList.contains('active')) {
          if (e.key === 'Escape') {
            imageViewer.classList.remove('active');
            resetZoom();
          } else if (e.key === '+' || e.key === '=') {
            setScale(currentScale + 0.2);
          } else if (e.key === '-' || e.key === '_') {
            setScale(currentScale - 0.2);
          } else if (e.key === '0') {
            resetZoom();
          } else if (e.key === 'ArrowLeft') {
            translateX += 20;
            updateImageTransform();
          } else if (e.key === 'ArrowRight') {
            translateX -= 20;
            updateImageTransform();
          } else if (e.key === 'ArrowUp') {
            translateY += 20;
            updateImageTransform();
          } else if (e.key === 'ArrowDown') {
            translateY -= 20;
            updateImageTransform();
          }
        }
      });
    });
  </script>
</body>
</html>
