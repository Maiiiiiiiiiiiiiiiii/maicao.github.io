<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DABC KITCHEN</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
  <style>
    /* 基础样式 */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* 主容器 */
    .frame-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .frame {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #FFFFFF;
      transform-origin: top left;
    }
    
    /* 欢迎文本 */
    .welcome-text {
      position: absolute;
      width: 152px;
      height: 96px;
      left: calc(50% - 152px/2);
      top: 50px;
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 300;
      font-size: 36px;
      line-height: 48px;
      text-align: center;
      color: #000000;
      transition: transform 0.5s ease;
    }
    
    /* DABC KITCHEN 标题 */
    .dabc-kitchen-title {
      position: absolute;
      width: 1105px;
      height: 126px;
      left: calc(50% - 1105px/2 - 0.5px);
      top: 290px;
      transform-origin: center;
      transition: transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      z-index: 10;
    }
    
    .dabc-kitchen-title:hover {
      animation-play-state: paused;
    }
    
    /* 手图标 */
    .hand {
      position: absolute;
      width: 75px;
      height: 60px;
      left: 1570px;
      top: 437px;
      transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform-origin: center;
      z-index: 11;
    }
    
    /* 动画关键帧 */
    @keyframes titleAnimation {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
      }
    }
    
    @keyframes handAnimation {
      0% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(-38px, -28px);
      }
      100% {
        transform: translate(0, 0);
      }
    }
    
    /* 应用动画 */
    .dabc-kitchen-title.animated {
      animation: titleAnimation 4s ease-in-out infinite;
    }
    
    .hand.animated {
      animation: handAnimation 4s ease-in-out infinite;
    }
    
    /* 人员肖像 - 通用样式 */
    .portrait {
      position: absolute;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .portrait.enlarged {
      transform: scale(1.15);
      z-index: 1002;
    }
    
    /* 镜像SVG的特殊处理 */
    .portrait.mirror {
      transform: matrix(-1, 0, 0, 1, 0, 0);
    }
    
    .portrait.mirror.enlarged {
      transform: matrix(-1, 0, 0, 1, 0, 0) scale(1.15);
    }
    
    .portrait-yinong {
      width: 141px;
      height: 240px;
      left: 464px;
      top: 638px;
    }
    
    .portrait-weiwei {
      width: 175px;
      height: 257px;
      left: 565px;
      top: 619px;
    }
    
    .nathaly-michelle {
      width: 134px;
      height: 208px;
      left: 726px;
      top: 667px;
    }
    
    .portrait-salvatore {
      width: 176px;
      height: 250px;
      left: 850px;
      top: 628px;
      z-index: 1000;
    }
    
    .portrait-amirhossein {
      width: 191px;
      height: 221px;
      left: 969px;
      top: 655px;
    }
    
    .portrait-beyza {
      width: 201px;
      height: 253px;
      left: 1110px;
      top: 628px;
      z-index: 999;
    }
    
    .portrait-mai {
      width: 225px;
      height: 256px;
      left: 1277px;
      top: 628px;
    }
    
    /* 名字文本样式 */
    .name-text {
      position: absolute;
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 300;
      font-size: 20px;
      line-height: 26px;
      text-align: center;
      color: #000000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 1001;
      background: rgba(255, 255, 255, 0.8);
      padding: 5px 10px;
      border-radius: 4px;
    }
    
    .name-text.show {
      opacity: 1;
    }
    
    .name-yinong {
      width: 120px;
      height: 26px;
      left: calc(50% - 120px/2 - 435px);
      top: 559px;
    }
    
    .name-weiwei {
      width: 108px;
      height: 26px;
      left: calc(50% - 108px/2 - 296px);
      top: 559px;
    }
    
    .name-nathaly {
      width: 192px;
      height: 52px;
      left: calc(50% - 192px/2 - 159px);
      top: 559px;
    }
    
    .name-salvatore {
      width: 204px;
      height: 26px;
      left: calc(50% - 204px/2 - 23px);
      top: 559px;
    }
    
    .name-amirhossein {
      width: 240px;
      height: 26px;
      left: calc(50% - 240px/2 + 107px);
      top: 559px;
    }
    
    .name-beyza {
      width: 132px;
      height: 26px;
      left: calc(50% - 132px/2 + 270px);
      top: 559px;
    }
    
    .name-mai {
      width: 84px;
      height: 26px;
      left: calc(50% - 84px/2 + 403px);
      top: 559px;
    }
    
    /* Logo */
    .logo-dabc {
      position: absolute;
      width: 526px;
      height: 70px;
      left: calc(50% - 526px/2);
      top: 940px;
    }

    /* video icon */
    .icon-video {
      position: absolute;
      width: 130.81px;
      height: 86px;
      left: calc(50% - 130.81px/2 + 0.4px);
      top: calc(50% - 86px/2 - 13px);
      cursor: pointer;
      transition: transform 0.3s ease;
      z-index: 20;
    }
    
    .icon-video:hover {
      transform: scale(1.1);
    }
    
    /* 视频模态框 - 调整尺寸 */
    .video-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    
    .video-modal.show {
      opacity: 1;
      visibility: visible;
    }
    
    .video-container {
      position: relative;
      width: 85%; /* 增加宽度 */
      max-width: 1200px; /* 增加最大宽度 */
      height: auto;
      aspect-ratio: 16/9; /* 保持16:9比例 */
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }
    
    .video-player {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    
    .video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px 15px;
      display: flex;
      align-items: center;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    
    .video-container:hover .video-controls {
      transform: translateY(0);
    }
    
    .play-pause-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 18px;
      margin-right: 12px;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .play-pause-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .progress-container {
      flex-grow: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      margin-right: 12px;
      cursor: pointer;
      position: relative;
    }
    
    .progress-bar {
      height: 100%;
      background: #ff6b6b;
      border-radius: 6px;
      width: 0%;
      transition: width 0.2s ease;
    }
    
    .time {
      color: white;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      margin: 0 10px;
      min-width: 45px;
      text-align: center;
    }
    
    .volume-container {
      display: flex;
      align-items: center;
      margin-right: 15px;
    }
    
    .volume-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 18px;
      margin-right: 8px;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .volume-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .volume-slider {
      width: 90px;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
    }
    
    .volume-level {
      height: 100%;
      background: white;
      border-radius: 6px;
      width: 100%;
      transition: width 0.2s ease;
    }
    
    .fullscreen-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 18px;
      margin-left: 10px;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .close-video-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      z-index: 2001;
      transition: background 0.3s ease;
    }
    
    .close-video-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }
    
    /* 提示信息 */
    .hint {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 16px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    
    .hint.show {
      opacity: 1;
    }

    /* 视频标题 */
    .video-title {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.6);
      padding: 5px 12px;
      border-radius: 4px;
      z-index: 2001;
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <div class="frame">
      <!-- 欢迎文本 -->
      <div class="welcome-text">WELCOME TO</div>
      
      <!-- DABC KITCHEN 标题 -->
      <a href="dabc-kitchen-menu.html" class="dabc-kitchen-title-link">
        <img class="dabc-kitchen-title" src="assets/material_asset/dabc-kitchen.svg" alt="DABC KITCHEN">

      <!-- 手图标 -->
      <img class="hand" src="assets/material_asset/hand.svg" alt="Hand">

      <img class="portrait nathaly-michelle" src="assets/material_asset/nathaly-michelle-rodriquez-torres.svg" alt="Nathaly Michelle Rodriquez Torres" data-name="nathaly">

      <!-- 名字文本 -->
      <div class="name-text name-yinong">Yinong Xue</div>
      <div class="name-text name-weiwei">Weiwei Ma</div>
      <div class="name-text name-nathaly">Nathaly Michelle Rodriquez Torres</div>
      <div class="name-text name-salvatore">Salvatore Viscuso</div>
      <div class="name-text name-amirhossein">Amirhossein Ahmadnia</div>
      <div class="name-text name-beyza">Beyza Goren</div>
      <div class="name-text name-mai">Mai Cao</div>
      
      <!-- Logo -->
      <img class="logo-dabc" src="assets/material_asset/logo-dabc.svg" alt="DABC Logo">

  </div>
  
  <!-- 视频模态框 -->
  <div class="video-modal" id="video-modal">
    <div class="video-container" id="video-container">
      <div class="video-title">DABC KITCHEN Introduction</div>
      <video class="video-player" id="main-video" loop>
        <source src="assets/material_asset/video/dabc-kitchen-start.mp4" type="video/mp4">
        您的浏览器不支持视频播放
      </video>
      <button class="close-video-btn" id="close-video">×</button>
      <div class="video-controls">
        <button class="play-pause-btn" id="play-pause">▶</button>
        <span class="time" id="current-time">0:00</span>
        <div class="progress-container" id="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <span class="time" id="duration">0:00</span>
        <div class="volume-container">
          <button class="volume-btn" id="volume-btn">🔊</button>
          <div class="volume-slider" id="volume-slider">
            <div class="volume-level" id="volume-level"></div>
          </div>
        </div>
        <button class="fullscreen-btn" id="fullscreen-btn">⛶</button>
      </div>
    </div>
  </div>
  
  <div class="hint" id="click-hint">Go to menu</div>

  <script>
    // 缩放函数
    function resizeFrame() {
      const frame = document.querySelector('.frame');
      const container = document.querySelector('.frame-container');
      
      // 计算缩放比例
      const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
      );
      
      // 应用缩放
      frame.style.transform = `scale(${scale})`;
      
      // 居中定位
      frame.style.position = 'absolute';
      frame.style.left = `${(window.innerWidth - 1920 * scale) / 2}px`;
      frame.style.top = `${(window.innerHeight - 1080 * scale) / 2}px`;
    }

    // 初始缩放和窗口调整事件
    window.addEventListener('load', function() {
      resizeFrame();
      
      // 页面加载后延迟一下再开始动画
      setTimeout(startAnimations, 1000);
    });
    window.addEventListener('resize', resizeFrame);

    // 开始动画
    function startAnimations() {
      const title = document.querySelector('.dabc-kitchen-title');
      const hand = document.querySelector('.hand');
      
      // 添加动画类
      title.classList.add('animated');
      hand.classList.add('animated');
      
      // 显示提示信息
      const hint = document.getElementById('click-hint');
      hint.classList.add('show');
      
      // 5秒后隐藏提示
      setTimeout(() => {
        hint.classList.remove('show');
      }, 5000);
    }

    // SVG加载错误处理
    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('error', function() {
        console.error('无法加载图片: ', this.src);
        this.style.backgroundColor = '#f0f0f0';
        this.style.border = '2px dashed #ccc';
        this.style.display = 'flex';
        this.style.justifyContent = 'center';
        this.style.alignItems = 'center';
        this.style.fontSize = '12px';
        this.style.color = '#999';
        
        // 获取文件名
        const fileName = this.src.split('/').pop();
        this.alt = `无法加载: ${fileName}`;
        
        // 如果没有替代文本，使用文件名
        if (!this.nextElementSibling || !this.nextElementSibling.classList.contains('error-message')) {
          const errorMsg = document.createElement('div');
          errorMsg.className = 'error-message';
          errorMsg.textContent = `无法加载: ${fileName}`;
          errorMsg.style.position = 'absolute';
          errorMsg.style.top = '50%';
          errorMsg.style.left = '50%';
          errorMsg.style.transform = 'translate(-50%, -50%)';
          errorMsg.style.color = '#ff0000';
          errorMsg.style.fontSize = '14px';
          errorMsg.style.fontWeight = 'bold';
          this.appendChild(errorMsg);
        }
      });
    });
    
    // 为标题添加鼠标事件
    const title = document.querySelector('.dabc-kitchen-title');
    const titleLink = document.querySelector('.dabc-kitchen-title-link');
    
    title.addEventListener('mouseenter', function() {
      // 暂停动画，保持当前状态
      this.style.animationPlayState = 'paused';
      
      // 显示提示
      document.getElementById('click-hint').classList.add('show');
    });
    
    title.addEventListener('mouseleave', function() {
      // 继续动画
      this.style.animationPlayState = 'running';
      
      // 隐藏提示
      document.getElementById('click-hint').classList.remove('show');
    });
    
    // 防止链接点击时事件冒泡
    titleLink.addEventListener('click', function(e) {
      e.stopPropagation();
    });
    
    // 人物点击显示名字和放大功能
    const portraits = document.querySelectorAll('.portrait');
    const nameTexts = document.querySelectorAll('.name-text');
    let currentActivePortrait = null;
    
    // 为每个人物添加点击事件
    portraits.forEach(portrait => {
      portrait.addEventListener('click', function(e) {
        e.stopPropagation(); // 阻止事件冒泡
        
        const name = this.getAttribute('data-name');
        const nameElement = document.querySelector(`.name-${name}`);
        
        // 如果点击的是当前已激活的人物，则隐藏名字并复原
        if (currentActivePortrait === this) {
          hideAllNamesAndResetPortraits();
          currentActivePortrait = null;
          return;
        }
        
        // 隐藏所有名字和复原所有SVG
        hideAllNamesAndResetPortraits();
        
        // 显示当前点击的名字
        nameElement.classList.add('show');
        
        // 放大当前点击的SVG
        this.classList.add('enlarged');
        
        // 设置当前激活的人物
        currentActivePortrait = this;
      });
    });
    
    // 点击页面任何其他地方隐藏所有名字和复原SVG
    document.addEventListener('click', function() {
      hideAllNamesAndResetPortraits();
      currentActivePortrait = null;
    });
    
    // 防止点击名字文本时触发隐藏
    nameTexts.forEach(text => {
      text.addEventListener('click', function(e) {
        e.stopPropagation();
      });
    });
    
    // 隐藏所有名字和复原所有SVG的函数
    function hideAllNamesAndResetPortraits() {
      nameTexts.forEach(text => {
        text.classList.remove('show');
      });
      
      portraits.forEach(portrait => {
        portrait.classList.remove('enlarged');
      });
    }

    // 视频播放功能
    const videoIcon = document.querySelector('.icon-video');
    const videoModal = document.getElementById('video-modal');
    const videoPlayer = document.getElementById('main-video');
    const closeVideoBtn = document.getElementById('close-video');
    const playPauseBtn = document.getElementById('play-pause');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const volumeBtn = document.getElementById('volume-btn');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeLevel = document.getElementById('volume-level');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const videoContainer = document.getElementById('video-container');

    // 跟踪全屏状态
    let isFullscreen = false;

    // 打开视频模态框
    videoIcon.addEventListener('click', function() {
      videoModal.classList.add('show');
      videoPlayer.play().catch(e => {
        console.log("自动播放被阻止，需要用户交互");
      });
      updatePlayButton();
    });

    // 关闭视频模态框
    function closeVideoModal() {
      // 先退出全屏（如果处于全屏状态）
      if (isFullscreen) {
        exitFullscreen();
      }
      
      videoModal.classList.remove('show');
      videoPlayer.pause();
      videoPlayer.currentTime = 0;
      progressBar.style.width = '0%';
      currentTimeEl.textContent = '0:00';
      updatePlayButton();
    }

    closeVideoBtn.addEventListener('click', closeVideoModal);

    // 点击模态框背景关闭
    videoModal.addEventListener('click', function(e) {
      if (e.target === videoModal) {
        closeVideoModal();
      }
    });

    // 退出全屏的函数
    function exitFullscreen() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
      isFullscreen = false;
      fullscreenBtn.textContent = '⛶';
    }

    // 播放/暂停切换
    playPauseBtn.addEventListener('click', function() {
      if (videoPlayer.paused) {
        videoPlayer.play();
      } else {
        videoPlayer.pause();
      }
      updatePlayButton();
    });

    // 更新播放按钮图标
    function updatePlayButton() {
      if (videoPlayer.paused) {
        playPauseBtn.textContent = '▶';
      } else {
        playPauseBtn.textContent = '❚ ❚';
      }
    }

    // 格式化时间显示
    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      seconds = Math.floor(seconds % 60);
      return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    // 更新进度条
    videoPlayer.addEventListener('timeupdate', function() {
      const progress = (videoPlayer.currentTime / videoPlayer.duration) * 100;
      progressBar.style.width = `${progress}%`;
      currentTimeEl.textContent = formatTime(videoPlayer.currentTime);
      
      // 更新总时长（只在第一次设置）
      if (durationEl.textContent === '0:00' && !isNaN(videoPlayer.duration)) {
        durationEl.textContent = formatTime(videoPlayer.duration);
      }
    });

    // 点击进度条跳转
    progressContainer.addEventListener('click', function(e) {
      const pos = (e.pageX - this.getBoundingClientRect().left) / this.offsetWidth;
      videoPlayer.currentTime = pos * videoPlayer.duration;
    });

    // 音量控制
    volumeBtn.addEventListener('click', function() {
      if (videoPlayer.volume > 0) {
        videoPlayer.volume = 0;
        volumeLevel.style.width = '0%';
        volumeBtn.textContent = '🔇';
      } else {
        videoPlayer.volume = 1;
        volumeLevel.style.width = '100%';
        volumeBtn.textContent = '🔊';
      }
    });

    // 音量滑块控制
    volumeSlider.addEventListener('click', function(e) {
      const pos = (e.pageX - this.getBoundingClientRect().left) / this.offsetWidth;
      videoPlayer.volume = pos;
      volumeLevel.style.width = `${pos * 100}%`;
      updateVolumeIcon();
    });

    // 更新音量图标
    function updateVolumeIcon() {
      if (videoPlayer.volume === 0) {
        volumeBtn.textContent = '🔇';
      } else if (videoPlayer.volume < 0.5) {
        volumeBtn.textContent = '🔈';
      } else {
        volumeBtn.textContent = '🔊';
      }
    }

    // 全屏功能
    fullscreenBtn.addEventListener('click', function() {
      if (!isFullscreen) {
        if (videoContainer.requestFullscreen) {
          videoContainer.requestFullscreen();
        } else if (videoContainer.webkitRequestFullscreen) {
          videoContainer.webkitRequestFullscreen();
        } else if (videoContainer.msRequestFullscreen) {
          videoContainer.msRequestFullscreen();
        }
        fullscreenBtn.textContent = '⛶';
        isFullscreen = true;
      } else {
        exitFullscreen();
      }
    });

    // 监听全屏变化事件
    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    document.addEventListener('msfullscreenchange', handleFullscreenChange);

    function handleFullscreenChange() {
      // 检查当前是否处于全屏状态
      isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
      
      if (!isFullscreen) {
        fullscreenBtn.textContent = '⛶';
      }
    }

    // 视频结束时重置
    videoPlayer.addEventListener('ended', function() {
      // 由于设置了循环，这个事件可能不会触发
      updatePlayButton();
    });

    // 视频加载完成时更新时长
    videoPlayer.addEventListener('loadedmetadata', function() {
      durationEl.textContent = formatTime(videoPlayer.duration);
    });

    // 添加键盘控制
    document.addEventListener('keydown', function(e) {
      if (!videoModal.classList.contains('show')) return;
      
      switch(e.key) {
        case ' ':
          // 空格键切换播放/暂停
          if (videoPlayer.paused) {
            videoPlayer.play();
          } else {
            videoPlayer.pause();
          }
          updatePlayButton();
          e.preventDefault();
          break;
        case 'Escape':
          // ESC键关闭模态框
          closeVideoModal();
          break;
        case 'ArrowRight':
          // 右箭头快进5秒
          videoPlayer.currentTime = Math.min(videoPlayer.duration, videoPlayer.currentTime + 5);
          break;
        case 'ArrowLeft':
          // 左箭头后退5秒
          videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 5);
          break;
        case 'ArrowUp':
          // 上箭头增加音量
          videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.1);
          volumeLevel.style.width = `${videoPlayer.volume * 100}%`;
          updateVolumeIcon();
          break;
        case 'ArrowDown':
          // 下箭头减少音量
          videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.1);
          volumeLevel.style.width = `${videoPlayer.volume * 100}%`;
          updateVolumeIcon();
          break;
        case 'f':
        case 'F':
          // F键切换全屏
          fullscreenBtn.click();
          break;
      }
    });
  </script>
</body>
</html>
