<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DABC KITCHEN MENU</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300&family=Rationale&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
  <style>
    /* 基础样式 */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* 主容器 */
    .frame-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .frame {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #FFFFFF;
      transform-origin: top left;
    }
    
    /* DABC KITCHEN 标题 */
    .dabc-kitchen {
      position: absolute;
      width: 403.41px;
      height: 46px;
      left: calc(50% - 403.41px/2 + 1.71px);
      top: 50px;
    }
    
    .label {
      position: absolute;
      font-family: 'Rationale', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 40px;
      line-height: 46px;
      text-align: center;
      color: #000000;
      transition: transform 0.5s ease;
      pointer-events: none; /* 防止标签阻止容器点击 */
    }

    .label-paper-panel {
      width: 170px;
      height: 46px;
      left: 877px;
      top: 120px;
    }
    
    .label-paper-panel-2 {
      width: 222px;
      height: 46px;
      left: 562px;
      top: 468px;
    }

    .label-paper-panel-3 {
      width: 253px;
      height: 46px;
      left: 537px;
      top: 626px;
    }

    .recipe {
        position: absolute;
        width: 87px;
        height: 29px;
        left: 866px;
        top: 367px;
        font-family: 'Recursive';
        font-style: normal;
        font-weight: 400;
        font-size: 24px;
        line-height: 29px;
        /* identical to box height */
        text-align: center;
        color: #000000;
    }
    
    .tutorial-video {
      /* Tutorial Video */
      position: absolute;
      width: 116px;
      height: 58px;
      left: 1114px;
      top: 367px;
      font-family: 'Recursive';
      font-style: normal;
      font-weight: 400;
      font-size: 24px;
      line-height: 29px;
      color: #000000;
    }
    
    .application {
        position: absolute;
        width: 159px;
        height: 29px;
        left: 1455px;
        top: 367px;
        font-family: 'Recursive';
        font-style: normal;
        font-weight: 400;
        font-size: 24px;
        line-height: 29px;
        /* identical to box height */
        text-align: center;
        color: #000000;
    }

    .chef {
        position: absolute;
        width: 58px;
        height: 29px;
        left: calc(50% - 58px/2 - 679px);
        top: 751px;
        font-family: 'Recursive';
        font-style: normal;
        font-weight: 400;
        font-size: 24px;
        line-height: 29px;
        /* identical to box height */
        text-align: center;
        color: #000000;
    }
    
    .weiwei-ma {
        position: absolute;
        width: 179px;
        height: 46px;
        left: calc(50% - 179px/2 - 678.5px);
        top: 780px;
        font-family: 'Reenie Beanie', cursive;
        font-style: normal;
        font-weight: 400;
        font-size: 40px;
        line-height: 46px;
        text-align: center;
        color: #000000;
    }
    
    /* Logo */
    .logo-dabc {
      position: absolute;
      width: 526px;
      height: 70px;
      left: calc(50% - 526px/2);
      top: 940px;
    }
    
    /* 返回按钮 */
    .dabc-back {
      position: absolute;
      width: 63px;
      height: 50.5px;
      left: 1782px;
      top: 69px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .dabc-back:hover {
      transform: scale(1.1);
    }
    
    /* 添加的SVG样式 */
    .portrait-weiwei-ma {
      position: absolute;
      width: 295px;
      height: 433px;
      left: 113px;
      top: 292px;
    }
    
    .icon-recipe {
      position: absolute;
      width: 82px;
      height: 112px;
      left: 866px;
      top: 454px;
    }
    
    .icon-recipe-1 {
      position: absolute;
      width: 82px;
      height: 112px;
      left: 866px;
      top: 589px;
    }

    .icon-video-1 {
      position: absolute;
      width: 181px;
      height: 119px;
      left: 1114px;
      top: 454px;
    }

    .icon-video-1-1 {
      position: absolute;
      width: 181px;
      height: 119px;
      left: 1114px;
      top: 589px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .icon-video-1-1:hover {
      transform: scale(1.05);
    }

    .icon-video-2 {
      position: absolute;
      width: 181px;
      height: 119px;
      left: 1455px;
      top: 454px;
    }
    
    .icon-video-2-1 {
      position: absolute;
      width: 181px;
      height: 119px;
      left: 1455px;
      top: 589px;
    }

    /* 视频覆盖层样式 */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    
    .video-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    .video-container {
      position: relative;
      width: 80%;
      max-width: 900px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    
    .video-player {
      width: 100%;
      display: block;
    }
    
    .video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
      padding: 15px;
      display: flex;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .video-container:hover .video-controls {
      opacity: 1;
    }
    
    .play-pause-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      margin-right: 15px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .progress-container {
      flex-grow: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      margin-right: 15px;
      cursor: pointer;
      position: relative;
    }
    
    .progress-bar {
      height: 100%;
      background: #e74c3c;
      border-radius: 5px;
      width: 0%;
    }
    
    .time-display {
      color: white;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      margin-right: 15px;
    }
    
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1010;
      transition: background 0.3s ease;
    }
    
    .close-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }
    
    .fullscreen-btn {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <div class="frame-container">
    <div class="frame">
      <!-- 标题 -->
      <img class="dabc-kitchen" src="assets/material_asset/dabc-kitchen.svg" alt="DABC KITCHEN">
      
      <!-- 添加的SVG图标 -->
      <img class="portrait-weiwei-ma" src="assets/material_asset/portrait-weiwei.svg" alt="Mai Cao Portrait">
      <img class="icon-recipe" src="assets/material_asset/icon-recipe.svg" alt="Recipe Icon">
      <img class="icon-recipe-1" src="assets/material_asset/icon-recipe.svg" alt="Recipe Icon">
      <img class="icon-video-1" src="assets/material_asset/icon-video.svg" alt="Video Icon 1">
      <img class="icon-video-1-1" src="assets/material_asset/icon-video.svg" alt="Video Icon 1" id="espresso-video-trigger">
      <img class="icon-video-2" src="assets/material_asset/icon-video.svg" alt="Video Icon 2">
      <img class="icon-video-2-1" src="assets/material_asset/icon-video.svg" alt="Video Icon 2">
     
      <!-- 文字标签 - 保持原有位置 -->
      <div class="label label-paper-panel">Coffee brick</div>
      <div class="label label-paper-panel-2">Rooibos Latte Sawdust Brick</div>
      <div class="label label-paper-panel-3">Espresso Sawdust Brick</div>
      <div class="recipe">Recipe</div>
      <div class="tutorial-video">Tutorial Video</div>
      <div class="application">Application</div>
      <div class="chef">Chef</div>
      <div class="weiwei-ma">Weiwei Ma</div>
      
      <!-- Logo -->
      <img class="logo-dabc" src="assets/material_asset/logo-dabc.svg" alt="DABC Logo">
      
      <!-- 返回按钮 -->
      <a href="dabc-kitchen-menu.html">
        <img class="dabc-back" src="assets/material_asset/dabc-back.svg" alt="Back">
      </a>
    </div>
  </div>

  <!-- 视频覆盖层 -->
  <div class="video-overlay" id="video-overlay">
    <div class="video-container">
      <video class="video-player" id="video-player">
        <source src="assets/material_asset/video/espresso-sawdust-brick.mp4" type="video/mp4">
        您的浏览器不支持视频播放。
      </video>
      <button class="close-btn" id="close-video">×</button>
      <div class="video-controls">
        <button class="play-pause-btn" id="play-pause">▶</button>
        <div class="progress-container" id="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time-display" id="time-display">00:00 / 00:00</div>
        <button class="fullscreen-btn" id="fullscreen-btn">⛶</button>
      </div>
    </div>
  </div>

  <script>
    // 缩放函数
    function resizeFrame() {
      const frame = document.querySelector('.frame');
      const container = document.querySelector('.frame-container');
      
      // 计算缩放比例
      const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
      );
      
      // 应用缩放
      frame.style.transform = `scale(${scale})`;
      
      // 居中定位
      frame.style.position = 'absolute';
      frame.style.left = `${(window.innerWidth - 1920 * scale) / 2}px`;
      frame.style.top = `${(window.innerHeight - 1080 * scale) / 2}px`;
    }

    // 初始缩放和窗口调整事件
    window.addEventListener('load', function() {
      resizeFrame();
    });
    window.addEventListener('resize', resizeFrame);

    // SVG加载错误处理
    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('error', function() {
        console.error('无法加载图片: ', this.src);
        this.style.backgroundColor = '#f0f0f0';
        this.style.border = '2px dashed #ccc';
        this.style.display = 'flex';
        this.style.justifyContent = 'center';
        this.style.alignItems = 'center';
        this.style.fontSize = '12px';
        this.style.color = '#999';
        
        // 获取文件名
        const fileName = this.src.split('/').pop();
        this.alt = `无法加载: ${fileName}`;
        
        // 如果没有替代文本，使用文件名
        if (!this.nextElementSibling || !this.nextElementSibling.classList.contains('error-message')) {
          const errorMsg = document.createElement('div');
          errorMsg.className = 'error-message';
          errorMsg.textContent = `无法加载: ${fileName}`;
          errorMsg.style.position = 'absolute';
          errorMsg.style.top = '50%';
          errorMsg.style.left = '50%';
          errorMsg.style.transform = 'translate(-50%, -50%)';
          errorMsg.style.color = '#ff0000';
          errorMsg.style.fontSize = '14px';
          errorMsg.style.fontWeight = 'bold';
          this.appendChild(errorMsg);
        }
      });
    });

    // 视频播放功能
    document.addEventListener('DOMContentLoaded', function() {
      const videoTrigger = document.getElementById('espresso-video-trigger');
      const videoOverlay = document.getElementById('video-overlay');
      const videoPlayer = document.getElementById('video-player');
      const closeVideo = document.getElementById('close-video');
      const playPauseBtn = document.getElementById('play-pause');
      const progressBar = document.getElementById('progress-bar');
      const progressContainer = document.getElementById('progress-container');
      const timeDisplay = document.getElementById('time-display');
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      
      // 打开视频覆盖层
      videoTrigger.addEventListener('click', function() {
        videoOverlay.classList.add('active');
        videoPlayer.play();
        updatePlayButton();
      });
      
      // 关闭视频覆盖层
      closeVideo.addEventListener('click', function() {
        videoOverlay.classList.remove('active');
        videoPlayer.pause();
      });
      
      // 点击覆盖层背景关闭视频
      videoOverlay.addEventListener('click', function(e) {
        if (e.target === videoOverlay) {
          videoOverlay.classList.remove('active');
          videoPlayer.pause();
        }
      });
      
      // 播放/暂停按钮
      playPauseBtn.addEventListener('click', function() {
        if (videoPlayer.paused) {
          videoPlayer.play();
        } else {
          videoPlayer.pause();
        }
        updatePlayButton();
      });
      
      // 更新播放按钮状态
      function updatePlayButton() {
        if (videoPlayer.paused) {
          playPauseBtn.textContent = '▶';
        } else {
          playPauseBtn.textContent = '❚❚';
        }
      }
      
      // 更新进度条
      videoPlayer.addEventListener('timeupdate', function() {
        const progress = (videoPlayer.currentTime / videoPlayer.duration) * 100;
        progressBar.style.width = `${progress}%`;
        
        // 更新时间显示
        const currentTime = formatTime(videoPlayer.currentTime);
        const duration = formatTime(videoPlayer.duration);
        timeDisplay.textContent = `${currentTime} / ${duration}`;
      });
      
      // 点击进度条跳转
      progressContainer.addEventListener('click', function(e) {
        const rect = progressContainer.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;
        const seekTime = (clickX / width) * videoPlayer.duration;
        videoPlayer.currentTime = seekTime;
      });
      
      // 视频结束重置
      videoPlayer.addEventListener('ended', function() {
        playPauseBtn.textContent = '▶';
        progressBar.style.width = '0%';
      });
      
      // 全屏按钮
      fullscreenBtn.addEventListener('click', function() {
        if (videoPlayer.requestFullscreen) {
          videoPlayer.requestFullscreen();
        } else if (videoPlayer.webkitRequestFullscreen) {
          videoPlayer.webkitRequestFullscreen();
        } else if (videoPlayer.msRequestFullscreen) {
          videoPlayer.msRequestFullscreen();
        }
      });
      
      // 格式化时间显示
      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }
      
      // 键盘控制
      document.addEventListener('keydown', function(e) {
        if (videoOverlay.classList.contains('active')) {
          if (e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            if (videoPlayer.paused) {
              videoPlayer.play();
            } else {
              videoPlayer.pause();
            }
            updatePlayButton();
          } else if (e.key === 'Escape') {
            videoOverlay.classList.remove('active');
            videoPlayer.pause();
          }
        }
      });
    });
  </script>
</body>
</html>
